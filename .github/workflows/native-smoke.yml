name: Native smoke

# Drives the real app on a Mac: GPUIX links and the Full HTML WKWebView hiding under overlays.
# Also run by the release (blocking); here a runner quirk or native change shows up before a tag.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/native/**
      - src/html-view.tsx
      - src/overlays.ts
      - src/whats-new-sheet.tsx
      - scripts/testing/overlay-webview.tsx
      - scripts/native/**
      - scripts/bundle.ts
      - .github/workflows/native-smoke.yml
  push:
    branches: [main]
    paths:
      - src/native/**
      - src/html-view.tsx
      - src/overlays.ts
      - src/whats-new-sheet.tsx
      - scripts/testing/overlay-webview.tsx
      - scripts/native/**
      - scripts/bundle.ts
      - .github/workflows/native-smoke.yml

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these run on pull requests, including forks, and never see a secret.
permissions:
  contents: read

jobs:
  smoke:
    name: Native smoke (macOS)
    runs-on: macos-15 # GitHub-hosted, so pull requests from forks run too
    timeout-minutes: 45
    env:
      NAPI_RS_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/build/native/gpuix-native.darwin-arm64.node
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - run: bun install --frozen-lockfile
      # The patched renderer the release ships; bundle builds the same thing first.
      - run: bun run native:links
      - name: Overlays hide the Full HTML web view
        run: bun scripts/testing/overlay-webview.tsx
      - name: Native link interactions
        run: |
          bun scripts/testing/markdown-link-events.tsx
          bun scripts/testing/link-popover-compact.tsx
