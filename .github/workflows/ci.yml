name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    # Linux x64: GPUIX ships a linux-x64 build and the macOS-only code is guarded, so everything but
    # the Keychain tests runs here at a twentieth of a Mac's cost. Those run in the release job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./src ./scripts

