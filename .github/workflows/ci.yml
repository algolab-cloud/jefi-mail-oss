name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: these run on pull requests, including forks, and never see a secret.
permissions:
  contents: read

jobs:
  app:
    name: App (typecheck + tests)
    # Linux x64: GPUIX ships a linux-x64 build and the macOS-only code is guarded, so everything but
    # the Keychain tests runs here at a twentieth of a Mac's cost. Those run in the release job.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # A dependency with a known high or critical advisory fails the build (Dependabot opens the fix).
      - name: Known vulnerabilities
        run: bun audit --audit-level=high
      - run: bun run typecheck
      - run: bun test ./src ./scripts

